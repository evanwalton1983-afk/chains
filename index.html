<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chains">
<meta name="description" content="Personal NFL player prop research. Trends, matchup context, price shopping, parlays, and closing-line tracking.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<title>Chains</title>
<style>
:root{
  --night:#0E1A2B; --deck:#14233A; --deck2:#1A2C46; --rail:#253955; --chalk:#EEF2F7; --fog:#8D9EB6; --dim:#5E708A;
  --stripe:#FFD21F; --scrim:#4C8DFF; --flag:#FF6A3D;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--scrim);outline-offset:2px;border-radius:4px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:640px;margin:0 auto}

.top{position:sticky;top:0;z-index:20;background:rgba(14,26,43,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--rail)}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:24px;letter-spacing:.02em}
.brand svg{width:26px;height:26px}
.wk{margin-left:auto;font-family:var(--cond);font-size:17px;color:var(--fog)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--fog);flex:none}
.icon-btn:hover{color:var(--chalk);background:var(--deck)}
.icon-btn svg{width:22px;height:22px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--deck);border-top:1px solid var(--rail);padding-bottom:var(--safe-b)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--cond);font-size:15px;font-weight:600;color:var(--dim);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--chalk)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--stripe);border-radius:0 0 3px 3px}
.tabs .count[hidden]{display:none}
.tabs .count{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stripe);color:var(--night);font-size:12px;font-weight:700;display:grid;place-items:center}

main{padding:0 16px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
.section-h h2{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1.1}
.section-h .acts{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--rail);font-family:var(--cond);font-size:16px;font-weight:600;color:var(--fog)}
.chip[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--night)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
@media (min-width:540px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters select{height:36px;padding:0 6px;background:var(--deck);border:1px solid var(--rail);border-radius:8px;font-size:14px;color:var(--fog);min-width:0}
.filters select.on{color:var(--chalk);border-color:var(--fog)}

.rows{list-style:none;border-top:1px solid var(--rail)}
.row{border-bottom:1px solid var(--rail)}
.row>button{width:100%;text-align:left;display:grid;grid-template-columns:1fr 124px;gap:3px 12px;padding:13px 2px}
.row .who{font-family:var(--cond);font-size:21px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{font-size:15px;color:var(--fog);font-weight:500;margin-left:6px}
.row .what{font-size:15px;color:var(--fog)}
.row .what b{color:var(--chalk);font-weight:600}
.row .meta{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fog);grid-column:1;flex-wrap:wrap}
.row .when{font-size:13px;color:var(--dim);grid-column:1}
.row .viz{grid-row:1 / span 4;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.links{display:inline-flex;gap:3px;vertical-align:middle}
.links i{display:block;width:10px;height:5px;border:1.5px solid var(--stripe);border-radius:3px}
.links i.off{border-color:var(--rail)}

.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-family:var(--cond);font-size:15px;font-weight:700;white-space:nowrap}
.tag.clears{background:var(--stripe);color:var(--night)}
.tag.watch{border:1.5px solid var(--scrim);color:var(--scrim)}
.tag.pass{border:1.5px solid var(--rail);color:var(--fog)}
.tag.win{background:var(--chalk);color:var(--night)}
.tag.loss{border:1.5px solid var(--flag);color:var(--flag)}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.mini{width:124px;height:40px;display:block}
.hit{fill:var(--chalk)}
.miss{fill:var(--dim);opacity:.55}
.push{fill:var(--fog);opacity:.8}
.fdl{stroke:var(--stripe);stroke-width:2.5;stroke-linecap:round}
.mini .fdl{stroke-width:2}
.vlab{font-family:var(--cond);font-size:9.5px;fill:var(--fog);text-anchor:middle}
.vlab.h{fill:var(--chalk)}
.olab{font-family:var(--cond);font-size:9px;fill:var(--dim);text-anchor:middle}
.sbound{stroke:var(--rail);stroke-width:1;stroke-dasharray:3 3}
.slab{font-family:var(--cond);font-size:10px;fill:var(--dim)}
@media (prefers-reduced-motion:no-preference){
  .chart.anim .fdl{stroke-dasharray:420;stroke-dashoffset:420;animation:draw .7s cubic-bezier(.3,.7,.2,1) .12s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}

.empty{padding:40px 8px}
.empty h3{font-family:var(--cond);font-size:24px;margin-bottom:6px}
.empty p{color:var(--fog);max-width:46ch;margin-bottom:18px}
.note{font-size:14px;color:var(--fog);margin:12px 0}
.note.warn{color:var(--flag)}
.progress{font-size:14px;color:var(--fog);padding:10px 0}
.banner{border:1.5px solid var(--flag);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.banner.good{border-color:var(--stripe)}

.btn{height:46px;padding:0 18px;border-radius:10px;font-family:var(--cond);font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{height:38px;font-size:16px;padding:0 14px}
.btn.primary{background:var(--stripe);color:var(--night)}
.btn.ghost{border:1.5px solid var(--rail);color:var(--chalk)}
.btn.danger{border:1.5px solid var(--flag);color:var(--flag)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 140px}
.fab{position:fixed;right:max(16px,calc(50vw - 304px));bottom:calc(76px + var(--safe-b));z-index:15;height:52px;padding:0 20px;border-radius:26px;background:var(--stripe);color:var(--night);font-family:var(--cond);font-size:19px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35)}

.game>button{width:100%;text-align:left;padding:14px 2px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.game .teams{font-family:var(--cond);font-size:22px;font-weight:600}
.game .teams span{color:var(--fog);font-weight:500;font-size:17px;margin:0 6px}
.game .when{font-size:14px;color:var(--fog)}
.game .lines{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:14px;color:var(--fog)}
.game .lines b{display:block;font-family:var(--cond);font-size:18px;color:var(--chalk);font-weight:600}
.game.done{opacity:.55}

.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(5,10,18,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--deck);border-radius:18px 18px 0 0;padding:8px 18px calc(24px + var(--safe-b));border-top:1px solid var(--rail);overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--rail);margin:4px auto 10px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-head h3{font-family:var(--cond);font-size:28px;font-weight:700;line-height:1.05}
.sheet-head p{color:var(--fog);font-size:15px;margin-top:2px}
.sheet-head .icon-btn{margin-left:auto}
.blk{padding:16px 0;border-top:1px solid var(--rail)}
.blk h4{font-family:var(--cond);font-size:19px;font-weight:700;margin-bottom:8px}
.seg{display:inline-grid;grid-auto-flow:column;border:1.5px solid var(--rail);border-radius:10px;overflow:hidden}
.seg button{height:40px;padding:0 14px;font-family:var(--cond);font-size:17px;font-weight:600;color:var(--fog)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--night)}
.linekey{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fog);margin:10px 0 4px}
.linekey i{width:18px;height:3px;background:var(--stripe);border-radius:2px;flex:none}
.alt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:6px 0 2px}
.alt input[type=range]{width:100%;accent-color:var(--stripe);height:28px}
.alt output{font-family:var(--cond);font-size:15px;color:var(--fog);grid-column:1 / span 2}
.alt output b{color:var(--chalk);font-weight:600}
.alt button{font-family:var(--cond);font-size:15px;color:var(--scrim)}
.splits{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rail);border:1px solid var(--rail);border-radius:10px;overflow:hidden}
.splits div{background:var(--deck);padding:8px 8px 7px;min-width:0}
.splits dt{font-size:12.5px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.splits dd{font-family:var(--cond);font-size:21px;font-weight:600;line-height:1.15}
.splits dd small{font-size:14px;color:var(--fog);font-weight:500;margin-left:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--fog)}
.kv dd{text-align:right;font-family:var(--cond);font-size:18px;font-weight:600}
.kv dd.big{font-size:24px;color:var(--stripe)}
.kv dd.sm{font-size:16px}
.books{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}
.books th{font-weight:500;color:var(--fog);text-align:right;padding:4px 6px;font-size:13px}
.books th:first-child,.books td:first-child{text-align:left;padding-left:0}
.books td{text-align:right;padding:6px;border-top:1px solid var(--rail);font-family:var(--cond);font-size:17px}
.books td:first-child{font-family:var(--body);font-size:15px}
.books tr.not td{color:var(--dim)}
.books td.best{color:var(--stripe);font-weight:700}
.reasons{list-style:none;display:grid;gap:8px}
.reasons li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.reasons li svg{width:18px;height:18px;margin-top:2px}
.reasons .on{color:var(--stripe)}
.reasons .bad{color:var(--flag)}
.reasons .muted{color:var(--dim)}

.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;color:var(--fog)}
.field input,.field select{height:46px;padding:0 12px;background:var(--night);border:1.5px solid var(--rail);border-radius:10px;width:100%}
.field input[type=range]{padding:0;border:0;background:none;accent-color:var(--stripe)}
.field input:focus,.field select:focus{border-color:var(--scrim);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.checks label{display:flex;align-items:center;gap:8px;font-size:15px}
.checks input{width:18px;height:18px;accent-color:var(--stripe);flex:none}
.results{list-style:none;max-height:300px;overflow-y:auto;border:1px solid var(--rail);border-radius:10px}
.results li button{width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--rail);display:flex;justify-content:space-between;gap:10px}
.results li:last-child button{border-bottom:0}
.results small{color:var(--fog)}
.roster{display:flex;flex-wrap:wrap;gap:8px}
.roster button{height:36px;padding:0 12px;border:1px solid var(--rail);border-radius:18px;font-size:15px}
.roster button small{color:var(--fog);margin-left:4px}
.roster button .inj{color:var(--flag);margin-left:4px;font-size:13px}

.leg{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rail)}
.leg .l1{font-family:var(--cond);font-size:19px;font-weight:600;line-height:1.15}
.leg .l2{font-size:14px;color:var(--fog)}
.bigline{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
.bigline .n{font-family:var(--cond);font-size:48px;font-weight:700;line-height:1}
.bigline .n.y{color:var(--stripe)}
.bigline .u{color:var(--fog)}
.calib{display:grid;gap:10px}
.calib .b{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.calib .track{position:relative;height:12px;background:var(--deck2);border-radius:6px;overflow:hidden}
.calib .fill{position:absolute;left:0;top:0;bottom:0;background:var(--chalk);border-radius:6px}
.calib .exp{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--stripe);border-radius:2px}
.meter{position:relative;height:10px;background:var(--deck2);border-radius:5px;margin:10px 0 4px;overflow:hidden}
.meter span{position:absolute;left:0;top:0;bottom:0;background:var(--chalk);border-radius:5px}
.pick{padding:12px 0;border-bottom:1px solid var(--rail)}
.pick .top1{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pick .t{font-family:var(--cond);font-size:19px;font-weight:600}
.pick .s{font-size:14px;color:var(--fog)}
.pick .c{font-size:14px;margin-top:3px}
.gradebtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gradebtns button{height:32px;padding:0 12px;border:1px solid var(--rail);border-radius:8px;font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%);z-index:60;width:max-content;max-width:min(92vw,560px);background:var(--chalk);color:var(--night);padding:12px 16px;border-radius:12px;font-size:15px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;align-items:center;gap:14px}
#toast.show{display:flex}
#toast button{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--night);text-decoration:underline;white-space:nowrap}
.foot{color:var(--dim);font-size:13px;margin:28px 0 96px;max-width:52ch}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="15" width="5" height="12" rx="1" fill="#EEF2F7"/><rect x="13.5" y="8" width="5" height="19" rx="1" fill="#EEF2F7"/><rect x="22" y="19" width="5" height="8" rx="1" fill="#5E708A"/><rect x="2" y="12.5" width="28" height="3" rx="1.5" fill="#FFD21F"/></svg><span>Chains</span></div>
  <div class="wk num" id="wkLabel"></div>
  <button class="icon-btn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main id="view" class="wrap"></main>

<nav class="tabs" aria-label="Main"><div class="wrap">
  <button data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V13M9.5 20V7M15 20v-9M20.5 20v-5"/><path d="M2.5 10.5h19" stroke="#FFD21F"/></svg>Board</button>
  <button data-tab="slate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Slate</button>
  <button data-tab="parlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="8" height="6" rx="3"/><rect x="13.5" y="9" width="8" height="6" rx="3"/><path d="M8 12h8"/></svg>Parlay<span class="count" id="parlayCount" hidden></span></button>
  <button data-tab="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9l2 2 4-4M8 15h8"/></svg>Record</button>
</div></nav>

<div id="sheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================
   Chains 2.4  |  Personal NFL prop research
   Data: nflverse schedule (GitHub), ESPN public JSON (rosters,
   game logs, box scores), Open-Meteo (weather), The Odds API
   (optional lines, all US books). Defense baseline: nflverse
   2025 weekly player stats, regular season, 17 games per team.
   ============================================================ */
const VERSION = '2.4.0';
const HOUR = 36e5, DAY = 864e5;
const now = () => Date.now();
const SEASON = (() => { const d = new Date(); return d.getMonth() < 2 ? d.getFullYear() - 1 : d.getFullYear(); })();
const SCHED_URL = 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv';
const ESPN_SITE = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const ESPN_WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/football/nfl';

/* ---------- legs that share a game ----------
   Multiplying the legs assumes they are independent. Two legs in the same game
   rarely are: a quarterback's yards and his receiver's catches rise and fall
   together, and a back's rushing over and his quarterback's passing over pull
   against each other. The multiplied number was wrong in a known direction for
   exactly the parlays you build most.

   The fix uses the players' own history. For each pair of same-game legs, every
   game both players appear in is scored at today's lines and sides, and the
   correlation between the two hit/miss records is measured (the phi
   coefficient). A phi from 20 shared games carries about 1/sqrt(20), or 0.22,
   of noise, which is as large as most real prop correlations, so it is shrunk:
   with real correlations spread about 0.15 either side of zero, the estimate
   keeps n/(n+40) of what it measured. Pairs with fewer than 6 shared games
   (players on opposite teams share only their head to head meetings) are left
   independent, and the page says so.

async function runPull(ids, btn) {

  try {

    closeSheet(); state.tab = 'board'; render(); evalAll();
    const un = r.unmatched.length;

async function pullLines(ids, onStep) {
  const S = state.settings; if (!S.oddsKey) throw new Error('Add your Odds API key in Settings first.');
  const key = encodeURIComponent(S.oddsKey.trim());
  const er = await fetch(`${ODDS}/sports/americanfootball_nfl/events?apiKey=${key}`);
  if (er.status === 401) throw new Error('The Odds API did not accept that key. Check it in Settings.');
  if (!er.ok) throw new Error('The Odds API returned error ' + er.status);
  const events = await er.json();
  const mk = S.markets.map(k => MARKETS[k].odds).join(',');
  if (!S.markets.length) throw new Error('No markets are ticked in Settings.');
  let added = 0, updated = 0, skipped = 0, noEvent = 0, remaining = null, step = 0; const unmatchedNames = new Set();
  for (const gid of ids) {
    onStep && onStep(++step, ids.length);
    const g = state.gameById[gid];
    const ev = events.find(e => abbrFromName(e.home_team) === g.home && abbrFromName(e.away_team) === g.away && Math.abs(Date.parse(e.commence_time) - g.kickoff) < 36 * HOUR);
    if (!ev) { noEvent++; continue; }
    const r = await fetch(`${ODDS}/sports/americanfootball_nfl/events/${ev.id}/odds?apiKey=${key}&regions=us&markets=${mk}&oddsFormat=american`);
    await noteCredits(r); if (state.credits) remaining = state.credits.remaining;
    if (r.status === 429) throw new Error('Out of Odds API credits for this month.');
    if (!r.ok) continue;
    const coll = collectEventBooks(await r.json());
    if (!Object.keys(coll).length) { noEvent++; continue; }
    const players = [...await roster(g.home).catch(() => []), ...await roster(g.away).catch(() => [])];
    const match = nameMatcher(players);
    for (const [mkey, byWho] of Object.entries(coll)) for (const [who, books] of Object.entries(byWho)) {
      const pl = match(who); if (!pl) { unmatchedNames.add(who); continue; }
      const sm = summarizeBooks(books, S.myBooks, MARKETS[mkey].yesNo);
      if (sm.over == null && sm.under == null) { skipped++; continue; }
      const id = `${gid}:${pl.id}:${mkey}`, exists = state.props.find(x => x.id === id);
      await saveProp({...(exists || {}), id, athleteId:pl.id, name:pl.name, pos:pl.pos, team:pl.team, gameId:gid, market:mkey, line:sm.line,
        overOdds:sm.over, underOdds:sm.under, overBook:sm.overBook, underBook:sm.underBook, consensus:sm.cons,
        books:books.map(b => ({key:b.key, title:b.title, point:b.point, over:b.over, under:b.under})), source:'odds', updatedAt:now()});
      exists ? updated++ : added++;
    }
    if (g.kickoff > now() && g.kickoff - now() < 3 * HOUR) await applyClosesFromBooks(gid, coll);
  }
  return {added, updated, skipped, unmatched:[...unmatchedNames], noEvent, remaining};
}

  }

    test('Rosters (ESPN)', async () => { const r = await fetch(`${ESPN_SITE}/teams/12/roster`); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); return (j.athletes || []).length ? 'working' : 'empty reply'; }),
    test('Game logs (ESPN)', async () => { const r = await fetch(`${ESPN_WEB}/athletes/3139477/gamelog?season=${SEASON - 1}`); if (!r.ok) throw new Error('HTTP ' + r.status); return parseGamelog(await r.json(), SEASON - 1).length ? 'working' : 'empty reply'; }),
    test('Box scores (ESPN)', async () => { if (!sample) return 'no sample game'; const r = await fetch(`${ESPN_SITE}/summary?event=${sample.espn}`); if (!r.ok) throw new Error('HTTP ' + r.status); return parseBox(await r.json(), sample, {}) ? 'working' : 'format changed, using 2025 baseline only'; }),
    test('Weather (Open-Meteo)', async () => { const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=39.05&longitude=-94.48&current=temperature_2m'); if (!r.ok) throw new Error('HTTP ' + r.status); return 'working'; }),
    test('Lines (The Odds API)', async () => {
      if (!state.settings.oddsKey) return 'no key saved, manual entry only';
      const r = await fetch(`${ODDS}/sports?apiKey=${encodeURIComponent(state.settings.oddsKey)}`);
      if (r.status === 401) throw new Error('key rejected'); if (!r.ok) throw new Error('HTTP ' + r.status);
      await noteCredits(r);
      const rem = r.headers.get('x-requests-remaining'); return rem != null ? `working, ${rem} credits left` : 'working';
    }),
  ]);
  out.innerHTML = rows.join('');
}

/* ---------- boot ---------- */
$$('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#btnSettings').onclick = openSettings;
async function boot() {
  try {
    const s = await db.get('kv', 'settings');
    if (s) { state.settings = {...DEFAULTS, ...s}; if (s.book && !s.myBooks) state.settings.myBooks = [s.book]; }
    state.props = await db.all('props'); state.picks = await db.all('picks'); state.parlay = (await db.get('kv', 'parlay')) || []; state.credits = (await db.get('kv', 'credits')) || null;
    refitShrink();
  } catch (e) { toast('Storage is unavailable, so nothing will be saved in this browser.'); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  state.dvp = computeDvp([]);
  render();
  try { await loadSchedule(); } catch (e) { toast('Could not load the NFL schedule. Check your connection.'); }
  render();
  await updateDvpLive().catch(() => {});
  evalAll();
  setTimeout(() => gradePending(false), 1500);
  setTimeout(() => captureCloses(false), 4000);
  setInterval(() => captureCloses(false), 10 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) captureCloses(false); });
  setTimeout(async () => {
    try {
      const last = await db.get('kv', 'lastBackup');
      if (state.picks.length >= 5 && (!last || now() - last > 30 * DAY)) toast(`You have ${state.picks.length} logged picks and no recent backup.`, {label:'Export', fn:exportBackup});
    } catch (e) {}
  }, 6000);
}
boot();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('A new version is ready', {label:'Reload', fn:() => nw.postMessage('skipWaiting')});
        });
      });
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  });
}
</script>
